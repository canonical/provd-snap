name: provd
base: core26-desktop
adopt-info: provd
summary: provd first-boot wizard backend as a confined provider snap
description: |
  The provd gRPC wizard backend (org.freedesktop.Accounts /
  hostname1 / locale1 / timedate1 / GDM client) packaged as a provider
  snap for Ubuntu Core Desktop, replacing the copy the fat base baked
  into /usr/libexec. Staged from the same resolute `provd` deb the fat
  base shipped (0.1.5, universe) - the override-build md5 gate asserts
  byte-identity with that binary, so a silent archive bump fails the
  build instead of drifting the wizard backend.

  base is core26-desktop (like the accountsservice provider snap): the
  wizard stack historically ran against the desktop base's /usr, and the
  daemon runs in that namespace.

  Phase B (confinement): apps.provd is a user-scope systemd daemon
  (daemon: simple + daemon-scope: user) - snapd generates
  /etc/systemd/user/snap.provd.provd.service and starts it with every
  user manager; the base bakes a ConditionGroup=gnome-initial-setup
  drop-in so it only actually runs for the transient wizard user. It
  must run as the session user because it binds the wizard gRPC socket
  itself and chmods it 0600 (the Flutter UI connects to it), and
  because its gsettings/dconf writes go over the session bus. The
  socket stays at /run/gnome-initial-setup/desktop-provision/init.socket
  (the path the raw-exec'd UI hardcodes) via the provd-run system-files
  plug against the implicit core slot; the GDM session handoff runs
  through the new gdm interface plug; dconf writes go through the
  dbus-dconf plug connected to the session snap's dbus-dconf slot, which
  also grants the confined dconf-service the peer rule for this snap's
  label (the Phase A unconfined-sender denial).
grade: stable
confinement: strict

plugs:
  # The wizard gRPC socket directory: provd binds
  # /run/gnome-initial-setup/desktop-provision/init.socket itself. The
  # implicit core snap provides the slot (system:system-files), the same
  # shape the session snap's gnome-content-launch/shell-config-files
  # plugs use. NOTE: system-files paths must be LITERAL - the interface
  # validation rejects apparmor glob characters and appends {,/,/**}
  # (full recursion) to the declared path itself. File rules mediate the
  # filesystem-socket bind/connect on this image (same pattern as the
  # gdm private-bus access in the gdm interface).
  provd-run:
    interface: system-files
    write:
      - /run/gnome-initial-setup
  # dconf writer peer: connects to the session snap's dbus-dconf slot
  # (ca.desrt.dconf, session bus). The connection adds this snap's label
  # to the dconf-service side's receive policy - without it the confined
  # dconf-service denies the wizard's commits (Phase A open issue).
  dbus-dconf:
    interface: dbus
    bus: session
    name: ca.desrt.dconf

apps:
  provd:
    command: usr/libexec/provd
    daemon: simple
    daemon-scope: user
    plugs:
      # CreateUser/SetPassword/SetAutomaticLogin via the accountsservice
      # provider snap (T4.1); provd is only a polkit subject, no polkit
      # plug needed (the daemon does the CheckAuthorization).
      - accountsservice
      # Manager.OpenSession + the private session bus the call returns
      # (session handoff at wizard completion; gdm.New is fatal to
      # services.NewManager, so this rule must be right).
      - gdm
      # CreateUser also drives hostname1.SetStaticHostname; the keyboard
      # and locale pages drive locale1.SetX11Keyboard/SetLocale.
      - hostname-control
      - locale-control
      - timezone-control
      - dbus-dconf
      - provd-run
      # provd self-binds its gRPC unix socket (net.Listen); the seccomp
      # template denies listen(2) for snap apps - network-bind is the
      # standard server-socket grant (accept/accept4/bind/listen, all
      # domains incl. AF_UNIX). Its AppArmor side adds `network bind`
      # (INET), which provd never uses - accepted overgrant for the
      # standard-interface shape.
      - network-bind
    environment:
      # The staged deb closure: the dconf GSettings backend module and
      # the compiled glib schemas. The rootfs ships neither - gio scans
      # the compiled-in prefix of the loaded libgio (the base's), and
      # GIO_EXTRA_MODULES is load-bearing: without it gsettings writes
      # silently no-op into the NULL backend (Phase A fix, now pointed
      # at the snap's own staged copy). $CRAFT_ARCH_TRIPLET_BUILD_FOR
      # is expanded by snapcraft at pack time (per build arch).
      GIO_EXTRA_MODULES: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas

parts:
  provd:
    plugin: nil
    # SIZE SURGERY (T4.6): the original staging listed `provd` +
    # `gnome-keyring` as stage-packages and packed 179.4 MB. Two archive
    # facts blow the closure up if apt resolves those names:
    #   1. resolute's provd 0.1.5 carries "Pre-Depends:
    #      gnome-initial-setup" - a HARD edge that drags the entire
    #      wizard-GUI closure (webkitgtk-6.0 90M, libLLVM 133M via mesa,
    #      gtk4+adwaita, gstreamer plugins, pipewire/wireplumber,
    #      glycin, gnome-settings-daemon, geoclue, icu 32M) into
    #      staging: 273 debs, none of which the headless daemon loads.
    #   2. gnome-keyring Depends gcr -> gcr4 -> libgcr-ui-3-1 ->
    #      libgtk-4-1 (25M+) although gnome-keyring-daemon's loader
    #      closure only uses libgck-1 + libgcr-base-3.
    # The provd binary's real DT_NEEDED closure is 40 libraries (walked
    # with objdump: libcrypt/glib/gio/gobject from the base, libgdk-3 ->
    # the X11/cairo/pango/wayland stack, gdk-pixbuf -> glycin, gck-1 +
    # gcr-base-3 for the keyring). provd itself only NEEDs libgdk-3, not
    # libgtk-3 (the gtk linkage in the deb's Depends is vestigial), but
    # libgtk-3.so.0 + atk are kept as cheap insurance (see prime notes).
    # So: the two tainted debs are dpkg-extracted in override-build, and
    # stage-packages lists only the packages that PROVIDE the needed
    # libs. The snap ends at its real runtime footprint (~x7 smaller);
    # every Phase B gate surface (dconf GIO module, glib schemas,
    # keyring daemon, X11 loader closure) is explicitly kept below.
    stage-packages:
      - libgtk-3-0t64
      - libgck-1-0
      - libgcr-base-3-1
      # libdconfsettings.so - the dconf GSettings backend gio loads
      # from GIO_EXTRA_MODULES (app env). LOAD-BEARING: without it
      # gsettings writes silently no-op into the NULL backend (Phase A
      # fix 2). Self-contained: NEEDs only gio/glib/gobject.
      - dconf-gsettings-backend
      # org.gnome.desktop.* schemas provd reads (a11y, interface,
      # input-sources, wm.preferences, system.location).
      # LOAD-BEARING (GSETTINGS_SCHEMA_DIR app env).
      - gsettings-desktop-schemas
    build-packages:
      # for glib-compile-schemas in override-prime
      - libglib2.0-bin
    override-build: |
      craftctl default
      # provd + gnome-keyring: download the archive debs and extract the
      # FILES only - bypassing apt resolution so provd's
      # Pre-Depends: gnome-initial-setup and gnome-keyring's gcr->gtk-4
      # branch never enter the staging closure (see the parts comment).
      apt-get download provd gnome-keyring
      dpkg-deb -x provd_*.deb "$CRAFT_PART_INSTALL"
      dpkg-deb -x gnome-keyring_*.deb "$CRAFT_PART_INSTALL"
      # Byte-identity gate: the fat base (and the desktop variant) shipped
      # usr/libexec/provd from the resolute/universe provd 0.1.5 deb with
      # this md5. Fail the build if the archive moves underneath us.
      # Per-arch expected md5 of the deb's usr/libexec/provd (amd64 and
      # arm64 ports builds differ, as ELFs do).
      arch="$(dpkg --print-architecture)"
      case "$arch" in
        amd64) expected=462a0a1f575bd5d4989cf96c08d842ac ;;
        arm64) expected=ffb36ef7f0f2994edadde696dcfc45d0 ;;
        *)
          echo "unsupported build architecture: $arch" >&2
          exit 1
          ;;
      esac
      actual="$(md5sum "$CRAFT_PART_INSTALL/usr/libexec/provd" | cut -d' ' -f1)"
      if [ "$actual" != "$expected" ]; then
        echo "provd md5 $actual != expected $expected (resolute 0.1.5 $arch)" >&2
        exit 1
      fi
      craftctl set version="$(dpkg-deb -f provd_*.deb Version)"
    override-prime: |
      craftctl default
      # The debs stage the gsettings schema sources but ship the compiled
      # database via a dpkg trigger that never runs in a snap build; gio
      # needs the compiled schemas at runtime or every GSettings lookup
      # fails (covers gsettings-desktop-schemas AND libgtk-3-common's
      # org.gtk.* schemas - both read through GSETTINGS_SCHEMA_DIR).
      glib-compile-schemas --strict "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      # The gio libproxy module's libpxbackend dependency sits in a
      # subdirectory only reached via the lib's own absolute RUNPATH -
      # invisible in a snap mount namespace (the kf6-core26 lesson) - so
      # gio logs a load error on every start. provd never resolves
      # network proxies; drop the module. (Defensive: glib-networking is
      # no longer staged, so the file normally does not exist.)
      rm -f "$CRAFT_PRIME"/usr/lib/*/gio/modules/libgiolibproxy.so
    prime:
      # ---- dead in a snap namespace ----
      # $SNAP/etc is never mounted into /etc (host /etc comes from the
      # variant - Phase B baked /etc/fonts there); deb conffiles under
      # /etc (fontconfig, pulse, ldap, xdg autostart, ...) are payload
      # for classic systems only. Same for /var state dirs.
      - -etc
      - -var
      # The deb's classic launcher execs /snap/bin/ubuntu-desktop-init
      # (snap run); on this image the host unit carries the UI exec.
      - -usr/libexec/launch-desktop-provision-init
      # gnome-keyring PAM module: PAM lives on the host side.
      - -usr/lib/*/security/pam_gnome_keyring.so
      # snap payload systemd units/sysusers/tmpfiles are inert (snapd
      # only generates units from app metadata).
      - -usr/lib/systemd
      - -usr/lib/sysusers.d
      - -usr/lib/tmpfiles.d
      - -usr/lib/udev
      - -usr/lib/emacsen-common
      - -usr/lib/aspell
      - -usr/lib/ispell
      # ---- headless daemon renders/sniffs nothing ----
      - -usr/share/icons
      - -usr/share/fonts
      - -usr/share/locale
      - -usr/share/mime
      - -usr/share/X11
      - -usr/share/xml
      - -usr/share/libgweather-4
      - -usr/share/iso-codes
      - -usr/share/sounds
      - -usr/share/themes
      - -usr/share/thumbnailers
      - -usr/share/pixmaps
      - -usr/share/zsh
      - -usr/share/xdg-desktop-portal
      - -usr/share/wireplumber
      - -usr/share/user-session-migration
      - -usr/share/pkgconfig
      - -usr/share/dbus-1
      # session activation files/policies are host+session-snap
      # territory; the bus never scans this snap's services dir.
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
      - -usr/share/applications
      - -usr/share/metainfo
      # ---- dlopen'd-but-never-used payload ----
      # glycin image decoders (gdk-pixbuf on resolute delegates to
      # glycin; provd loads no images). libglycin-2.so.0 itself is
      # DT_NEEDED by libgdk_pixbuf and STAYS.
      - -usr/libexec/glycin-loaders
      - -usr/share/glycin-loaders
      - -usr/bin/glycin-thumbnailer
      # glycin's sandbox helper - only the decoders above exec it.
      - -usr/bin/bwrap
      # dconf WRITER service: provd only carries the CLIENT backend
      # (libdconfsettings.so); the writer that commits is the session
      # snap's confined dconf-service, activated via the dbus-dconf
      # connection (Phase B evidence: writes land under
      # snap.ubuntu-desktop-session.dconf-service).
      - -usr/libexec/dconf-service
      # glib TLS/proxy modules: no glib-networking staged, and provd
      # does no TLS/proxy resolution.
      - -usr/libexec/glib-pacrunner
      # gtk-update-icon-cache / deb helper cruft.
      - -usr/bin/gtk-update-icon-cache
      - -usr/bin/gtk4-update-icon-cache
      - -usr/sbin
      # ---- deb-level deps that are NOT in the DT_NEEDED closure ----
      # (printing, avahi, colord, rsvg, their transitive media libs;
      # walked with objdump - libgtk-3.so.0 is the only consumer and it
      # itself is never loaded by provd - kept, these are not.)
      - -usr/lib/*/libcups*
      - -usr/lib/*/libavahi*
      - -usr/lib/*/libcolord*
      - -usr/lib/*/librsvg*
      - -usr/lib/*/libxml2*
      - -usr/lib/*/libheif*
      - -usr/lib/*/libjxl*
      - -usr/lib/*/libaom*
      - -usr/lib/*/libhwy*
      - -usr/lib/*/libsharpyuv*
      - -usr/lib/*/libdeflate*
      - -usr/lib/*/liblerc*
      - -usr/lib/*/libjbig*
      - -usr/lib/*/libtiff*
      - -usr/lib/*/libjpeg*
      - -usr/lib/*/libwebp*
      - -usr/lib/*/libdv*
      - -usr/lib/*/libiec61883*
      - -usr/lib/*/gio/modules/libgiolibproxy.so
